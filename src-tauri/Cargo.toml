[package]
name = "aqua-code"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "aqua_code_lib"
crate-type = ["lib", "cdylib", "staticlib"]
