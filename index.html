<!DOCTYPE html>
<html lang="ru" class="theme-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aqua Code V1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--fu:'Inter',sans-serif;--fm:'JetBrains Mono',monospace;--fd:'Orbitron',sans-serif;--r1:8px;--r2:12px;--r3:16px;--tr:0.2s ease}
.theme-dark{--c1:#00D4FF;--c1r:0,212,255;--c2:#7C4DFF;--bg:#010409;--s1:#0D1117;--s2:#161B22;--tx:#E6EDF3;--tm:#8B949E;--td:#484F58;--bd:#21262D;--ok:#4ADE80;--er:#FF7B72}
.theme-aqua{--c1:#00838F;--c1r:0,131,143;--c2:#0288D1;--bg:#F0FDFF;--s1:#FFF;--s2:#E0F7FA;--tx:#004D40;--tm:#00695C;--td:#B2EBF2;--bd:#B2EBF2;--ok:#66BB6A;--er:#D32F2F}
.theme-white{--c1:#00D4FF;--c1r:0,212,255;--c2:#0066FF;--bg:#FFF;--s1:#F8FAFC;--s2:#F1F5F9;--tx:#0F172A;--tm:#64748B;--td:#CBD5E1;--bd:#E2E8F0;--ok:#10B981;--er:#DC2626}
body{font-family:var(--fu);background:var(--bg);color:var(--tx);overflow:hidden;height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── TITLE BAR ── */
.tb{height:46px;display:flex;align-items:center;justify-content:space-between;background:var(--s1);border-bottom:1px solid var(--bd);padding:0 12px;user-select:none}
.tb-l,.tb-r{display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;padding:6px 14px;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:var(--r2);box-shadow:0 4px 16px rgba(var(--c1r),.3)}
.logo svg{width:14px;height:14px;fill:#fff}
.logo b{font:800 11px var(--fd);color:#fff;letter-spacing:2px}
.mb{background:none;border:none;color:var(--tm);font:500 12px var(--fu);padding:7px 10px;border-radius:var(--r1);cursor:pointer;transition:var(--tr)}
.mb:hover{color:var(--tx);background:rgba(var(--c1r),.08)}
.lb{display:flex;align-items:center;gap:5px;padding:5px 10px;background:rgba(var(--c1r),.12);border:1px solid rgba(var(--c1r),.3);border-radius:8px;color:var(--c1);cursor:pointer;font:700 10px var(--fd);letter-spacing:1px;transition:var(--tr)}
.lb:hover{background:rgba(var(--c1r),.2)}
.vb{padding:4px 8px;background:rgba(var(--c1r),.12);border:1px solid rgba(var(--c1r),.3);border-radius:6px;font:700 9px var(--fd);color:var(--c1);letter-spacing:1px}

/* ── MAIN ── */
.mn{display:flex;height:calc(100vh - 46px)}

/* ── ACTIVITY BAR ── */
.ab{width:46px;display:flex;flex-direction:column;justify-content:space-between;background:var(--s1);border-right:1px solid var(--bd);padding:10px 0}
.ab-g{display:flex;flex-direction:column;gap:3px;align-items:center}
.ab-i{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--tm);cursor:pointer;border-radius:var(--r1);transition:var(--tr)}
.ab-i:hover{background:rgba(var(--c1r),.08);color:var(--tx)}
.ab-i.on{background:rgba(var(--c1r),.12);border:1.5px solid rgba(var(--c1r),.35);color:var(--c1)}
.ab-i svg{width:17px;height:17px;fill:currentColor}

/* ── SIDEBAR ── */
.sb{width:250px;display:flex;flex-direction:column;background:var(--s1);border-right:1px solid var(--bd);flex-shrink:0}
.sb-h{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.sb-t{display:flex;align-items:center;gap:7px}
.sb-t span{font:700 9px var(--fd);color:var(--c1);letter-spacing:1.5px}
.sb-ic{display:flex;align-items:center;justify-content:center;padding:4px;background:rgba(var(--c1r),.15);border-radius:6px;color:var(--c1)}
.sb-ic svg{width:11px;height:11px;fill:currentColor}
.sb-a{display:flex;gap:2px}
.sba{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:rgba(var(--c1r),.08);border:none;border-radius:5px;color:var(--c1);cursor:pointer}
.sba:hover{background:rgba(var(--c1r),.15)}
.sba svg{width:11px;height:11px;fill:currentColor}
.sb-s{padding:4px 6px}
.sb-s input{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r1);color:var(--tx);font:12px var(--fu);outline:none;transition:var(--tr)}
.sb-s input:focus{border-color:var(--c1);box-shadow:0 0 0 2px rgba(var(--c1r),.1)}
.sb-s input::placeholder{color:var(--td)}
.ft{flex:1;overflow-y:auto;padding:2px 0}
.fn{display:flex;align-items:center;gap:5px;padding:5px 6px;margin:1px 3px;border-radius:6px;cursor:pointer;transition:var(--tr)}
.fn:hover{background:rgba(var(--c1r),.05)}
.fn.sel{background:rgba(var(--c1r),.1);outline:1px solid rgba(var(--c1r),.25)}
.fa{width:15px;display:flex;align-items:center;justify-content:center;color:var(--tm);transition:transform .2s;flex-shrink:0}
.fa svg{width:15px;height:15px;fill:currentColor}
.fa.ex{transform:rotate(90deg)}
.fa.hi{visibility:hidden}
.fi{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;flex-shrink:0}
.fi svg{width:11px;height:11px;fill:currentColor}
.fi.dir{background:rgba(255,202,40,.12);color:#FFCA28}
.fi.js{background:rgba(247,223,30,.15);color:#C8B400}
.fi.html{background:rgba(227,79,38,.12);color:#E34F26}
.fi.css{background:rgba(21,114,182,.12);color:#1572B6}
.fi.json{background:rgba(76,175,80,.12);color:#4CAF50}
.fi.md{background:rgba(156,39,176,.12);color:#9C27B0}
.fi.def{background:rgba(120,144,156,.12);color:#78909C}
.fn-n{flex:1;font-size:11px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fn.sel .fn-n{font-weight:600;color:var(--c1)}
.sb-f{display:flex;justify-content:space-evenly;padding:6px;border-top:1px solid var(--bd)}
.sbf{display:flex;align-items:center;justify-content:center;padding:6px;background:rgba(var(--c1r),.08);border:1px solid rgba(var(--c1r),.12);border-radius:var(--r2);color:var(--c1);cursor:pointer;transition:var(--tr)}
.sbf:hover{background:rgba(var(--c1r),.15);transform:translateY(-1px)}
.sbf svg{width:15px;height:15px;fill:currentColor}

/* ── EDITOR ── */
.ed{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.et{height:34px;display:flex;align-items:center;background:rgba(var(--c1r),.03);border-bottom:1px solid var(--bd);overflow-x:auto}
.et::-webkit-scrollbar{height:0}
.tb2{display:flex;align-items:center;gap:5px;height:100%;padding:0 12px;background:none;border:none;color:var(--tm);font:11px var(--fu);cursor:pointer;border-right:1px solid var(--bd);white-space:nowrap;transition:var(--tr)}
.tb2:hover{background:rgba(var(--c1r),.04)}
.tb2.on{background:rgba(var(--c1r),.08);color:var(--c1);box-shadow:inset 0 -2px 0 var(--c1)}
.tbc{width:16px;height:16px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--tm);cursor:pointer;border-radius:3px;font-size:13px}
.tbc:hover{background:rgba(var(--c1r),.15);color:var(--tx)}
.eb{flex:1;display:flex;overflow:hidden;position:relative}
.ln{width:44px;background:rgba(var(--c1r),.03);border-right:1px solid var(--bd);overflow:hidden;padding:14px 0}
.li2{height:19px;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font:10px var(--fm);color:rgba(var(--c1r),.3)}
.ce{flex:1;padding:14px;background:none;border:none;color:var(--tx);font:13px/1.7 var(--fm);resize:none;outline:none;tab-size:2;white-space:pre;overflow:auto}
.es{position:absolute;right:10px;bottom:10px;display:none;align-items:center;gap:5px;padding:6px 10px;background:rgba(var(--c1r),.08);border:1px solid rgba(var(--c1r),.2);border-radius:6px}
.esn{font:600 10px var(--fu);color:var(--c1)}

/* ── WELCOME ── */
.wc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;animation:fi .4s}
.wl{margin-bottom:28px;padding:32px;background:radial-gradient(circle,rgba(var(--c1r),.12),transparent);border-radius:50%}
.wli{padding:24px;background:linear-gradient(135deg,rgba(var(--c1r),.2),rgba(var(--c2),.1));border:1px solid rgba(var(--c1r),.2);border-radius:50%;color:rgba(var(--c1r),.6)}
.wli svg{width:56px;height:56px;fill:currentColor}
.wt{font:800 24px/1 var(--fd);letter-spacing:4px;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.ws2{font:400 14px var(--fu);color:var(--tm);margin-bottom:28px}
.wcr{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.wcd{width:150px;padding:16px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r3);text-align:center;cursor:pointer;transition:var(--tr)}
.wcd:hover{transform:translateY(-2px);border-color:rgba(var(--c1r),.3);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.wcd-i{display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin:0 auto 8px;background:linear-gradient(135deg,rgba(var(--c1r),.15),rgba(var(--c1r),.05));border-radius:var(--r2);color:var(--c1)}
.wcd-i svg{width:18px;height:18px;fill:currentColor}
.wcd span{display:block;font:600 12px var(--fu);color:var(--tx);margin-bottom:2px}
.wcd small{font-size:11px;color:var(--tm)}

/* ── CHAT ── */
.ch{width:320px;display:flex;flex-direction:column;background:var(--s1);border-left:1px solid var(--bd);flex-shrink:0}
.chh{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--bd)}
.cht{display:flex;align-items:center;gap:7px}
.chi{display:flex;align-items:center;justify-content:center;padding:4px;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:6px;box-shadow:0 3px 8px rgba(var(--c1r),.3)}
.chi svg{width:11px;height:11px;fill:#fff}
.cht span{font:800 9px var(--fd);color:var(--c1);letter-spacing:1px}
.cs{display:flex;align-items:center;gap:4px}
.sd{width:6px;height:6px;background:var(--ok);border-radius:50%;box-shadow:0 0 6px rgba(74,222,128,.6)}
.cs span{font:600 8px var(--fu);color:var(--ok)}
.cm{flex:1;overflow-y:auto;padding:10px}
.msg{display:flex;gap:7px;margin-bottom:10px;animation:fi .3s}
.av{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.av svg{width:13px;height:13px;fill:#fff}
.av.u{background:linear-gradient(135deg,#3B82F6,#1D4ED8)}
.av.a{background:linear-gradient(135deg,var(--c1),var(--c2))}
.bb{flex:1;padding:10px;background:var(--bg);border:1px solid var(--bd);border-radius:12px}
.msg.u .bb{background:rgba(var(--c1r),.08);border-radius:12px 12px 4px 12px}
.msg.a .bb{border-radius:12px 12px 12px 4px}
.bbs{font:700 9px var(--fu);color:var(--c1);margin-bottom:4px}
.bbt{font:12px/1.5 var(--fu);color:var(--tx);white-space:pre-wrap}
.cty{display:none;align-items:center;gap:6px;padding:6px 10px}
.spn{width:10px;height:10px;border:2px solid var(--bd);border-top-color:var(--c1);border-radius:50%;animation:sp .8s linear infinite}
.cty span{font:italic 10px var(--fu);color:var(--tm)}
.cin{display:flex;align-items:center;gap:5px;padding:8px;border-top:1px solid var(--bd)}
.ciw{flex:1;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;transition:var(--tr)}
.ciw:focus-within{border-color:var(--c1);box-shadow:0 0 0 2px rgba(var(--c1r),.1)}
.ciw svg{width:14px;height:14px;fill:rgba(var(--c1r),.5);flex-shrink:0}
.ciw input{flex:1;background:none;border:none;color:var(--tx);font:12px var(--fu);outline:none}
.ciw input::placeholder{color:var(--td)}
.snd{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--c1),var(--c2));border:none;border-radius:10px;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(var(--c1r),.3);flex-shrink:0;transition:var(--tr)}
.snd:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(var(--c1r),.4)}
.snd svg{width:14px;height:14px;fill:#fff}

/* ── SETTINGS ── */
.st2{display:none;height:calc(100vh - 46px);background:var(--bg)}
.ss{width:250px;display:flex;flex-direction:column;background:var(--s1);border-right:1px solid var(--bd)}
.ssh{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px}
.bk{display:flex;align-items:center;justify-content:center;padding:7px;background:rgba(var(--c1r),.12);border:1px solid rgba(var(--c1r),.2);border-radius:var(--r1);color:var(--c1);cursor:pointer;transition:var(--tr)}
.bk:hover{background:rgba(var(--c1r),.2);transform:translateX(-2px)}
.bk svg{width:13px;height:13px;fill:currentColor}
.ssh span{font:800 11px var(--fd);color:var(--c1);letter-spacing:2px}
.ssm{flex:1;padding:4px 8px}
.ssi{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:none;border-radius:var(--r1);cursor:pointer;margin-bottom:2px;transition:var(--tr)}
.ssi:hover{background:rgba(var(--c1r),.06)}
.ssi.on{background:rgba(var(--c1r),.1);outline:1px solid rgba(var(--c1r),.3)}
.ssii{display:flex;align-items:center;justify-content:center;padding:4px;background:rgba(var(--c1r),.08);border-radius:6px;color:var(--tm);transition:var(--tr)}
.ssi.on .ssii{background:rgba(var(--c1r),.15);color:var(--c1)}
.ssii svg{width:13px;height:13px;fill:currentColor}
.ssi span{font:500 12px var(--fu);color:var(--tm)}
.ssi.on span{font-weight:600;color:var(--c1)}
.sc{flex:1;overflow-y:auto;padding:28px}
.sst{font:800 11px var(--fd);color:var(--c1);letter-spacing:1.5px;margin-bottom:14px}
.lo{display:flex;align-items:center;gap:12px;padding:14px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r3);cursor:pointer;margin-bottom:8px;transition:var(--tr)}
.lo:hover{border-color:rgba(var(--c1r),.3)}
.lo.on{border-color:var(--c1);border-width:2px;background:rgba(var(--c1r),.04)}
.lc{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(var(--c1r),.15),rgba(var(--c1r),.05));border-radius:var(--r2);font:800 13px var(--fd);color:var(--c1)}
.li3{flex:1}
.ln2{font:600 14px var(--fu);color:var(--tx)}
.lnn{font:12px var(--fu);color:var(--tm)}
.ck{width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:var(--c1);border-radius:50%;opacity:0;transition:var(--tr)}
.ck svg{width:11px;height:11px;fill:#fff}
.lo.on .ck{opacity:1}
.tho{display:flex;align-items:center;gap:12px;padding:14px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r3);cursor:pointer;margin-bottom:8px;transition:var(--tr)}
.tho:hover{border-color:rgba(var(--c1r),.3)}
.tho.on{border-color:var(--c1);border-width:2px;background:rgba(var(--c1r),.04)}
.thp{width:38px;height:38px;border-radius:var(--r2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}
.thd{width:12px;height:12px;border-radius:50%}
.tho span{flex:1;font:500 13px var(--fu);color:var(--tx)}
.stl{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r1);margin-bottom:8px}
.stll{font:12px var(--fu);color:var(--tx)}
.stlv{font:600 12px var(--fu);color:var(--c1)}
.stsw{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r1);margin-bottom:6px}
.stsw label{font:12px var(--fu);color:var(--tx)}
.tg{position:relative;width:38px;height:22px;background:var(--bd);border-radius:11px;cursor:pointer;transition:var(--tr)}
.tg.on{background:var(--c1)}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:var(--td);border-radius:50%;transition:var(--tr)}
.tg.on::after{transform:translateX(16px);background:#fff}
.stsl{padding:12px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r1);margin-bottom:8px}
.stsh{display:flex;justify-content:space-between;margin-bottom:6px}
.stsh span{font:12px var(--fu);color:var(--tx)}
.stsh .vl{font:600 12px var(--fu);color:var(--c1)}
input[type=range]{width:100%;height:4px;background:var(--bd);border-radius:2px;outline:none;-webkit-appearance:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 2px 6px rgba(var(--c1r),.3)}
.svb{width:100%;padding:12px;background:linear-gradient(135deg,var(--c1),var(--c2));border:none;border-radius:var(--r1);color:#fff;font:700 13px var(--fu);cursor:pointer;box-shadow:0 4px 16px rgba(var(--c1r),.3);margin-top:16px;transition:var(--tr)}
.svb:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(var(--c1r),.4)}
.abl{display:flex;justify-content:center;margin-bottom:24px}
.abc{padding:32px;background:radial-gradient(circle,rgba(var(--c1r),.12),transparent);border-radius:50%}
.abn{padding:24px;background:linear-gradient(135deg,rgba(var(--c1r),.2),rgba(var(--c2),.1));border:1px solid rgba(var(--c1r),.2);border-radius:50%;color:rgba(var(--c1r),.6)}
.abn svg{width:52px;height:52px;fill:currentColor}
.abt{font:800 22px var(--fd);letter-spacing:3px;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:24px}

/* ── DIALOG ── */
.dov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.dlg{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r3);padding:18px;min-width:280px;animation:fi .2s}
.dlg h3{font:600 14px var(--fu);margin-bottom:10px;color:var(--tx)}
.dlg input{width:100%;padding:8px 12px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r1);color:var(--tx);font:13px var(--fu);outline:none;margin-bottom:10px;transition:var(--tr)}
.dlg input:focus{border-color:var(--c1)}
.db{display:flex;justify-content:flex-end;gap:5px}
.db button{padding:7px 14px;border:none;border-radius:var(--r1);font:600 12px var(--fu);cursor:pointer;transition:var(--tr)}
.db .c{background:var(--s1);color:var(--tm);border:1px solid var(--bd)}
.db .c:hover{background:var(--bd)}
.db .p{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.db .p:hover{opacity:.9}

/* ── CONTEXT MENU ── */
.cm2{position:fixed;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r1);padding:5px;min-width:160px;box-shadow:0 4px 20px rgba(0,0,0,.4);z-index:1000;display:none}
.cmi{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:5px;cursor:pointer;font:12px var(--fu);color:var(--tx);transition:var(--tr)}
.cmi:hover{background:rgba(var(--c1r),.1);color:var(--c1)}
.cmi.d{color:var(--er)}
.cmi.d:hover{background:rgba(255,123,114,.1)}

  const e=n.name.split('.').pop();const m={js:'M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2zm3 3v2h4V8H8zm0 4v2h10v-2H8zm0 4v1h6v-1H8z',html:'M12 18.175l-6.175-1.65V7.475L12 5.825l6.175 1.65v9.05L12 18.175zM5.825 15.925L12 17.575l6.175-1.65V8.425L12 6.775 5.825 8.425v7.5z',css:'M5 3l-.65 3.34h13.59L17.5 8.5H3.92l-.66 3.33h13.57l-.76 3.81-5.48 1.81-4.75-1.81.33-1.64H2.85l-.79 4 7.85 3 9.05-3 1.2-6.03.24-1.21L21.94 3H5z',json:'M5 3h2v2H5v5a2 2 0 01-2 2 2 2 0 012 2v5h2v-5a2 2 0 00-2-2 2 2 0 002-2V3zm6 0v2h2v2h-2v2a2 2 0 00-2 2v2h2v-2h2v2h-2v2a2 2 0 01-2 2v3h2v-3h2v3h2v-3a2 2 0 00-2-2 2 2 0 002-2v-2h-2v-2h2V9h-2V7h2V5h-2V3h-2z',md:'M3 5v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2zm4 3v2h4V8H7zm0 4v2h10v-2H7zm0 4v1h6v-1H7z'};
  return`<svg viewBox="0 0 24 24"><path d="${m[e]||'M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z'}"/></svg>`;
}
function rTree(nodes,d=0,q=''){if(!nodes)return'';const sq=q.toLowerCase();return[...nodes].sort((a,b)=>{if(a.is_dir&&!b.is_dir)return-1;if(!a.is_dir&&b.is_dir)return 1;return a.name.localeCompare(b.name)}).filter(n=>{if(!sq)return true;if(n.name.toLowerCase().includes(sq))return true;if(n.is_dir)return n.children?.some(c=>rTree([c],0,sq)!=='');return false}).map(n=>{const ex=exp.has(n.path),sel=selNode?.path===n.path;let h=`<div class="fn${sel?' sel':''}" data-p="${n.path}" data-d="${n.is_dir}" style="padding-left:${6+d*16}px"><span class="fa ${n.is_dir?(ex?'ex':''):'hi'}"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></span><span class="fi ${ic(n)}">${fIcon(n)}</span><span class="fn-n">${n.name}</span></div>`;if(n.is_dir&&ex&&n.children)h+=rTree(n.children,d+1,sq);return h}).join('')}
function rFT(){document.getElementById('fT').innerHTML=rTree(FT,0,iq())}
function findN(p,nodes){for(const n of nodes){if(n.path===p)return n;if(n.children){const f=findN(p,n.children);if(f)return f}}return null}
function findParent(p){const parts=p.split('/').filter(Boolean);parts.pop();return parts.length?'/'+parts.join('/'):''}

function rTabs(){document.getElementById('eT').innerHTML=openF.map((f,i)=>`<button class="tb2${f.path===actF?.path?' on':''}" data-i="${i}"><span style="color:${f.is_dir?'#FFCA28':'#00D4FF'};font-size:10px">●</span> ${f.name}<span class="tbc" data-c="${i}">×</span></button>`).join('')}
function rLN(){const ed=document.getElementById('cE'),ln=document.getElementById('lN');if(!ed||!ln)return;ln.innerHTML=Array.from({length:ed.value.split('\n').length},(_,i)=>`<div class="li2">${i+1}</div>`).join('')}
function openFile(n){if(n.is_dir)return;let c=cache.get(n.path);if(c===undefined){c=n.content||'// '+n.name;cache.set(n.path,c)}if(!openF.find(f=>f.path===n.path))openF.push(n);actF=n;document.getElementById('eB').style.display='flex';document.getElementById('wS').style.display='none';document.getElementById('cE').value=c;document.getElementById('eS').style.display='flex';document.getElementById('eSN').textContent=n.name;rTabs();rLN()}
function closeFile(i){const f=openF[i];openF.splice(i,1);if(actF?.path===f?.path){actF=openF[Math.min(i,openF.length-1)]||null;if(actF){document.getElementById('cE').value=cache.get(actF.path)||'';rLN();document.getElementById('eSN').textContent=actF.name}}if(!openF.length){actF=null;document.getElementById('eB').style.display='none';document.getElementById('wS').style.display='flex';document.getElementById('eS').style.display='none'}rTabs()}

let msgs=[{text:t('ai_hello'),u:false}];
function genR(i){const l=i.toLowerCase();if(l.includes('hello')||l.includes('привет'))return t('ai_hello');return locale==='ru'?`Понял: "${i}". Уточните!`:`Got it: "${i}". What specifically?`}
function rChat(){document.getElementById('cMs').innerHTML=msgs.map(m=>`<div class="msg ${m.u?'u':'a'}"><div class="av ${m.u?'u':'a'}"><svg viewBox="0 0 24 24"><path d="${m.u?'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z':'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z'}"/></svg></div><div class="bb"><div class="bbs">${m.u?'You':'Aqua Code V1'}</div><div class="bbt">${m.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div></div></div>`).join('');document.getElementById('cMs').scrollTop=99999}

let curSec='lang';
function rSet(){
  document.querySelectorAll('.ssi').forEach(i=>i.classList.toggle('on',i.dataset.sec===curSec));
  const c=document.getElementById('sC');
  if(curSec==='lang'){c.innerHTML=`<div class="sst">${t('language_label')}</div><div class="lo${locale==='ru'?' on':''}" data-l="ru"><div class="lc">RU</div><div class="li3"><div class="ln2">${locale==='ru'?'Русский':'Russian'}</div><div class="lnn">Русский</div></div><div class="ck"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div></div><div class="lo${locale==='en'?' on':''}" data-l="en"><div class="lc">EN</div><div class="li3"><div class="ln2">English</div><div class="lnn">${locale==='ru'?'Английский':'English'}</div></div><div class="ck"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div></div>`;c.querySelectorAll('.lo').forEach(o=>o.onclick=()=>{setLocale(o.dataset.l);document.getElementById('langLbl').textContent=o.dataset.l.toUpperCase();rSet()})}
  else if(curSec==='look'){const cur=theme;const th=[{id:'dark',n:t('settings_dark'),bg:'#010409',ac:'#00D4FF'},{id:'aqua',n:t('settings_aqua'),bg:'#F0FDFF',ac:'#00838F'},{id:'white',n:t('settings_white'),bg:'#FFFFFF',ac:'#00D4FF'}];c.innerHTML=`<div class="sst">${t('settings_theme')}</div>${th.map(x=>`<div class="tho${cur===x.id?' on':''}" data-t="${x.id}"><div class="thp" style="background:${x.bg}"><div class="thd" style="background:${x.ac}"></div></div><span>${x.n}</span><div class="ck"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div></div>`).join('')}`;c.querySelectorAll('.tho').forEach(o=>o.onclick=()=>{setTheme(o.dataset.t);rSet()})}
  else if(curSec==='ai2'){c.innerHTML=`<div class="sst">${t('settings_ai')}</div><div class="stl"><span class="stll">${t('settings_model')}</span><span class="stlv">Aqua Code V1</span></div><div class="stsl"><div class="stsh"><span>${t('settings_temperature')}</span><span class="vl" id="tV">${gs('at').toFixed(1)}</span></div><input type="range" min="0" max="2" step="0.1" value="${gs('at')}" id="tR"></div><div class="stl"><span class="stll">${t('settings_max_tokens')}</span><span class="stlv">${gs('amt')}</span></div><div class="stl"><span class="stll">${t('settings_context')}</span><span class="stlv">128K</span></div><div class="sst" style="margin-top:16px">${t('settings_features')}</div><div class="stsw"><label>${t('settings_completion')}</label><div class="tg${gs('acc')?' on':''}" data-k="acc"></div></div><div class="stsw"><label>${t('settings_errors')}</label><div class="tg${gs('aee')?' on':''}" data-k="aee"></div></div><div class="stsw"><label>${t('settings_refactor')}</label><div class="tg${gs('acr')?' on':''}" data-k="acr"></div></div><div class="stsw"><label>${t('settings_docs')}</label><div class="tg${gs('aad')?' on':''}" data-k="aad"></div></div><button class="svb" id="svB">${t('save')}</button>`;document.getElementById('tR').oninput=e=>{document.getElementById('tV').textContent=parseFloat(e.target.value).toFixed(1);ss2('at',parseFloat(e.target.value))};c.querySelectorAll('.tg').forEach(tg=>tg.onclick=()=>{tg.classList.toggle('on');ss2(tg.dataset.k,tg.classList.contains('on'))});document.getElementById('svB').onclick=toast}
  else if(curSec==='edit'){c.innerHTML=`<div class="sst">${t('settings_editor')}</div><div class="stsl"><div class="stsh"><span>${t('settings_font')}</span><span class="vl" id="fV">${gs('fs')}</span></div><input type="range" min="10" max="24" value="${gs('fs')}" id="fR"></div><div class="stsl"><div class="stsh"><span>${t('settings_tab_size')}</span><span class="vl" id="tS">${gs('ts')}</span></div><input type="range" min="2" max="8" value="${gs('ts')}" id="tSR"></div><div class="sst" style="margin-top:16px">${t('settings_features')}</div><div class="stsw"><label>${t('settings_word_wrap')}</label><div class="tg${gs('ww')?' on':''}" data-k="ww"></div></div><div class="stsw"><label>${t('settings_line_numbers')}</label><div class="tg${gs('ln')?' on':''}" data-k="ln"></div></div><div class="stsw"><label>${t('settings_auto_save')}</label><div class="tg${gs('as')?' on':''}" data-k="as"></div></div><button class="svb" id="svB">${t('save')}</button>`;document.getElementById('fR').oninput=e=>{document.getElementById('fV').textContent=e.target.value;ss2('fs',e.target.value);document.getElementById('cE').style.fontSize=e.target.value+'px'};document.getElementById('tSR').oninput=e=>{document.getElementById('tS').textContent=e.target.value;ss2('ts',e.target.value)};c.querySelectorAll('.tg').forEach(tg=>tg.onclick=()=>{tg.classList.toggle('on');ss2(tg.dataset.k,tg.classList.contains('on'))});document.getElementById('svB').onclick=toast}
  else if(curSec==='about'){c.innerHTML=`<div class="abl"><div class="abc"><div class="abn"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div></div></div><h1 class="abt">AQUA CODE V1</h1><div class="stl"><span class="stll">${t('settings_version')}</span><span class="stlv">1.0.0</span></div><div class="stl"><span class="stll">${t('settings_platform')}</span><span class="stlv">HTML/CSS/JS</span></div>`}
}
function toast(){const d=document.createElement('div');d.className='toast';d.textContent=t('saved_ok');document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
function showDlg(title,ph,cb){const o=document.getElementById('dO');document.getElementById('dT').textContent=title;document.getElementById('dI').placeholder=ph;document.getElementById('dI').value='';o.style.display='flex';document.getElementById('dI').focus();const cl=()=>o.style.display='none';document.getElementById('dOk').onclick=()=>{const v=document.getElementById('dI').value.trim();if(v){cb(v);cl()}};document.getElementById('dC').onclick=cl;document.getElementById('dI').onkeydown=e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v){cb(v);cl()}}}}

function init(){
  const sl=localStorage.getItem('a-l');if(sl)locale=sl;const st=localStorage.getItem('a-t');if(st)theme=st;
  document.documentElement.className='theme-'+theme;document.getElementById('langLbl').textContent=locale.toUpperCase();updUI();rChat();

  let showSb=true,showCh=true;
  document.querySelectorAll('.ab-i').forEach(i=>i.onclick=()=>{
    const p=i.dataset.p;
    if(p==='exp'){showSb=!showSb;document.getElementById('sidebar').style.display=showSb?'flex':'none'}
    else if(p==='ai'){showCh=!showCh;document.getElementById('chP').style.display=showCh?'flex':'none'}
    else if(p==='set'){document.getElementById('mainL').style.display='none';document.getElementById('setScr').style.display='flex';curSec='lang';rSet()}
    document.querySelectorAll('.ab-i').forEach(x=>x.classList.remove('on'));
    if((p==='exp'&&showSb)||(p==='ai'&&showCh))i.classList.add('on');
  });
  document.getElementById('bK').onclick=()=>{document.getElementById('mainL').style.display='flex';document.getElementById('setScr').style.display='none'};
  document.querySelectorAll('.ssi').forEach(i=>i.onclick=()=>{curSec=i.dataset.sec;rSet()});
  document.getElementById('langBtn').onclick=()=>{setLocale(locale==='ru'?'en':'ru');document.getElementById('langLbl').textContent=locale.toUpperCase();if(document.getElementById('setScr').style.display==='flex')rSet()};
  document.getElementById('sI').oninput=()=>rFT();
  document.getElementById('fT').onclick=e=>{const el=e.target.closest('.fn');if(!el)return;const node=findN(el.dataset.p);if(!node)return;if(node.is_dir){if(exp.has(node.path))exp.delete(node.path);else exp.add(node.path)}else{selNode=node;openFile(node)}rFT()};
  document.getElementById('fT').oncontextmenu=e=>{const el=e.target.closest('.fn');if(!el)return;e.preventDefault();const node=findN(el.dataset.p);if(!node)return;selNode=node;const m=document.getElementById('cm2');m.style.display='block';m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';m.querySelector('[data-a="nf"]').style.display=node.is_dir?'flex':'none';m.querySelector('[data-a="nfi"]').style.display=node.is_dir?'flex':'none'};
  document.addEventListener('click',()=>document.getElementById('cm2').style.display='none');
  document.querySelectorAll('.cmi').forEach(i=>i.onclick=()=>{const a=i.dataset.a;if(!selNode)return;const pp=selNode.is_dir?selNode.path:findParent(selNode.path);
    if(a==='nf')showDlg(t('new_folder'),t('folder_name'),name=>{const p=pp+'/'+name;const np={name,is_dir:true,path:p,children:[]};const par=findN(pp);if(par){if(!par.children)par.children=[];par.children.push(np)}else FT.push(np);exp.add(pp);rFT()});
    else if(a==='nfi')showDlg(t('new_file'),t('file_name'),name=>{const p=pp+'/'+name;const nf={name,is_dir:false,path:p,content:''};const par=findN(pp);if(par){if(!par.children)par.children=[];par.children.push(nf)}else FT.push(nf);rFT()});
    else if(a==='ren')showDlg(t('rename'),t('new_name'),name=>{const old=selNode.path;selNode.name=name;selNode.path=pp+'/'+name;if(selNode.children)selNode.children.forEach(c=>{c.path=selNode.path+'/'+c.name});rFT()});
    else if(a==='cp')navigator.clipboard.writeText(selNode.path).then(toast);
    else if(a==='del'){if(confirm(t('delete')+' "'+selNode.name+'"?')){const par=findN(findParent(selNode.path));if(par&&par.children)par.children=par.children.filter(c=>c!==selNode);else FT=FT.filter(c=>c!==selNode);selNode=null;rFT()}}
    document.getElementById('cm2').style.display='none'});
  const mkDir=isd=>showDlg(isd?t('new_folder'):t('new_file'),isd?t('folder_name'):t('file_name'),name=>{const fp='/'+name;if(isd)FT.push({name,is_dir:true,path:fp,children:[]});else FT.push({name,is_dir:false,path:fp,content:''});rFT()});
  document.getElementById('nfb').onclick=()=>mkDir(true);document.getElementById('nfi').onclick=()=>mkDir(false);document.getElementById('fnf').onclick=()=>mkDir(true);document.getElementById('fni2').onclick=()=>mkDir(false);document.getElementById('ref').onclick=()=>rFT();
  document.getElementById('eT').onclick=e=>{const cl=e.target.closest('.tbc');if(cl){closeFile(parseInt(cl.dataset.c));return}const tb=e.target.closest('.tb2');if(tb){const i=parseInt(tb.dataset.i);actF=openF[i];document.getElementById('cE').value=cache.get(actF.path)||'';document.getElementById('eSN').textContent=actF.name;rTabs();rLN()}};
  const ed=document.getElementById('cE');ed.oninput=()=>{if(actF){cache.set(actF.path,ed.value);rLN()}};ed.onscroll=()=>{document.getElementById('lN').scrollTop=ed.scrollTop};ed.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();const s=ed.selectionStart,en=ed.selectionEnd;ed.value=ed.value.substring(0,s)+'  '+ed.value.substring(en);ed.selectionStart=ed.selectionEnd=s+2;if(actF)cache.set(actF.path,ed.value);rLN()}};
  document.getElementById('sB').onclick=sendMsg;document.getElementById('cI').onkeydown=e=>{if(e.key==='Enter')sendMsg()};
  function sendMsg(){const inp=document.getElementById('cI');if(!inp.value.trim())return;const txt=inp.value.trim();inp.value='';msgs.push({text:txt,u:true});rChat();document.getElementById('cTy').style.display='flex';setTimeout(()=>{msgs.push({text:genR(txt),u:false});document.getElementById('cTy').style.display='none';rChat()},800)}
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='s'){e.preventDefault();toast()}});
  ed.style.fontSize=gs('fs')+'px';
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
