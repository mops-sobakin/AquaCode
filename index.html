<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaCode</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:#fafafa;color:#1a1a2e}

/* тёмная тема */
body.dark{background:#111827;color:#e5e7eb}
.dark .topbar{background:#1f2937;border-color:#374151}
.dark .sidebar{background:#1f2937;border-color:#374151}
.dark .activity{background:#111827;border-color:#374151}
.dark .activity button{color:#9ca3af}
.dark .activity button.active{color:#38bdf8;background:rgba(56,189,248,.1)}
.dark .editor{background:#0f172a}
.dark .tabs{background:#1e293b;border-color:#334155}
.dark .tab{color:#94a3b8}
.dark .tab.active{color:#fff;background:#0f172a}
.dark .line-num{color:#475569}
.dark textarea{color:#e2e8f0}
.dark .sidebar-head{border-color:#374151}
.dark .file-item:hover{background:rgba(255,255,255,.04)}
.dark .file-item.selected{background:rgba(56,189,248,.08);color:#38bdf8}
.dark .search-box{background:#0f172a;border-color:#374151;color:#e5e7eb}
.dark .chat{background:#1f2937;border-color:#374151}
.dark .chat-head{border-color:#374151}
.dark .chat-input{background:#0f172a;border-color:#374151;color:#e5e7eb}
.dark .msg-ai .bubble{background:#1e293b;border-color:#334155}
.dark .msg-user .bubble{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.2)}
.dark .msg-user .bubble{border-color:rgba(56,189,248,.15);background:rgba(56,189,248,.06)}
.dark .bubble{color:#e5e7eb}
.dark .settings{background:#111827}
.dark .settings .panel{background:#1f2937;border-color:#374151}
.dark .settings .item{color:#d1d5db}
.dark .settings .item:hover{background:rgba(255,255,255,.05)}
.dark .settings .item.active{color:#38bdf8;background:rgba(56,189,248,.08)}
.dark .settings .content{color:#e5e7eb}
.dark .settings h3{color:#f9fafb}
.dark .toggle{background:#4b5563}
.dark .toggle.on{background:#38bdf8}
.dark .select-opt{border-color:#374151;color:#d1d5db}
.dark .select-opt:hover{border-color:#6b7280}
.dark .select-opt.chosen{border-color:#38bdf8;background:rgba(56,189,248,.05)}
.dark .slider{-webkit-appearance:none;background:#374151}
.dark .slider::-webkit-slider-thumb{-webkit-appearance:none;background:#38bdf8}
.dark .toast{background:#1f2937;color:#e5e7eb;border:1px solid #374151}
.dark .topbar{color:#e5e7eb}

/* верхняя панель */
.topbar{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px;background:#fff;border-bottom:1px solid #e5e7eb;user-select:none;-webkit-user-region:drag;font-size:13px}
.topbar>*{-webkit-user-region:no-drag}
.topbar-left{display:flex;align-items:center;gap:12px}
.app-name{font-weight:700;font-size:14px;letter-spacing:.5px;color:#38bdf8}
.topbar-menu{display:flex;gap:2px}
.topbar-menu button{background:none;border:none;color:#6b7280;font:500 12px/1 'DM Sans',sans-serif;padding:5px 10px;border-radius:4px;cursor:pointer}
.topbar-menu button:hover{background:rgba(0,0,0,.05);color:#111827}
.dark .topbar-menu button:hover{background:rgba(255,255,255,.08);color:#f9fafb}
.topbar-right{display:flex;align-items:center;gap:8px}
.lang-btn{font-size:11px;font-weight:700;padding:4px 10px;border:1px solid #d1d5db;border-radius:4px;background:none;color:#6b7280;cursor:pointer;letter-spacing:.5px}
.lang-btn:hover{border-color:#9ca3af}
.dark .lang-btn{border-color:#4b5563;color:#9ca3af}
.dark .lang-btn:hover{border-color:#6b7280}
.ver{font-size:10px;color:#9ca3af;font-weight:500}

/* основная область */
.main{display:flex;height:calc(100vh - 40px)}

/* левая панель иконок */
.activity{width:42px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:8px 0;background:#fff;border-right:1px solid #e5e7eb}
.activity-top,.activity-bot{display:flex;flex-direction:column;gap:2px;align-items:center}
.activity button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:#9ca3af;border-radius:6px;cursor:pointer}
.activity button:hover{color:#374151;background:rgba(0,0,0,.04)}
.activity button.active{color:#0ea5e9;background:rgba(14,165,233,.08)}
.activity button svg{width:18px;height:18px;fill:currentColor}

/* сайдбар файлов */
.sidebar{width:220px;display:flex;flex-direction:column;background:#fff;border-right:1px solid #e5e7eb}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #e5e7eb}
.sidebar-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#6b7280}
.sidebar-btns{display:flex;gap:4px}
.sidebar-btns button{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid #e5e7eb;border-radius:4px;color:#9ca3af;cursor:pointer}
.sidebar-btns button:hover{color:#0ea5e9;border-color:#0ea5e9}
.dark .sidebar-btns button{border-color:#4b5563}
.dark .sidebar-btns button:hover{border-color:#38bdf8}
.sidebar-btns button svg{width:12px;height:12px;fill:currentColor}
.search-box{margin:8px 10px;padding:6px 10px;border:1px solid #e5e7eb;border-radius:6px;font:13px 'DM Sans',sans-serif;outline:none;width:calc(100% - 20px)}
.search-box:focus{border-color:#0ea5e9}
.files{flex:1;overflow-y:auto;padding:4px 0}
.file-item{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;font-size:13px;color:#374151;transition:background .1s}
.file-item:hover{background:rgba(0,0,0,.03)}
.file-item.selected{background:rgba(14,165,233,.07);color:#0ea5e9;font-weight:500}
.file-item .icon{width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.file-item .icon.folder{background:#fef3c7;color:#d97706}
.file-item .icon.js{background:#fef9c3;color:#ca8a04}
.file-item .icon.html{background:#fee2e2;color:#dc2626}
.file-item .icon.css{background:#dbeafe;color:#2563eb}
.file-item .icon.json{background:#d1fae5;color:#059669}
.file-item .icon.md{background:#ede9fe;color:#7c3aed}
.file-item .icon.default{background:#f3f4f6;color:#6b7280}
.dark .file-item .icon.default{background:#374151;color:#9ca3af}
.file-item .arrow{font-size:10px;color:#9ca3af;transition:transform .15s}
.file-item .arrow.open{transform:rotate(90deg)}
.file-children{padding-left:16px}

/* редактор */
.editor{flex:1;display:flex;flex-direction:column;background:#fafafa}
.tabs{display:flex;background:#f3f4f6;border-bottom:1px solid #e5e7eb;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:6px;padding:0 14px;height:34px;border:none;background:none;border-bottom:2px solid transparent;color:#6b7280;font:500 12px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
.tab:hover{color:#374151}
.tab.active{color:#111827;border-bottom-color:#0ea5e9;background:#fafafa}
.dark .tab.active{background:#0f172a}
.tab-close{font-size:14px;color:#9ca3af;cursor:pointer;margin-left:4px;line-height:1}
.tab-close:hover{color:#ef4444}
.editor-body{flex:1;display:flex;overflow:hidden}
.line-num{width:44px;padding:16px 0;text-align:right;font:12px 'Fira Code',monospace;color:#9ca3af;overflow:hidden;user-select:none;border-right:1px solid #e5e7eb;background:rgba(0,0,0,.01)}
.dark .line-num{background:rgba(0,0,0,.2)}
textarea{flex:1;padding:16px;border:none;outline:none;font:14px/1.7 'Fira Code',monospace;background:transparent;resize:none;tab-size:2}

/* приветственный экран */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#9ca3af}
.welcome h1{font-size:28px;font-weight:700;color:#111827;letter-spacing:-.5px}
.dark .welcome h1{color:#f9fafb}
.welcome p{font-size:14px;max-width:360px;text-align:center;line-height:1.6}
.welcome-cards{display:flex;gap:12px;margin-top:24px}
.welcome-card{width:160px;padding:20px;border:1px solid #e5e7eb;border-radius:10px;text-align:center;background:#fff;cursor:pointer;transition:border-color .15s}
.welcome-card:hover{border-color:#0ea5e9}
.dark .welcome-card{background:#1f2937;border-color:#374151}
.welcome-card .wc-icon{font-size:24px;margin-bottom:8px}
.welcome-card .wc-title{font-size:13px;font-weight:600;color:#374151;margin-bottom:4px}
.dark .welcome-card .wc-title{color:#e5e7eb}
.welcome-card .wc-desc{font-size:11px;color:#9ca3af}

/* чат */
.chat{width:300px;display:flex;flex-direction:column;background:#fff;border-left:1px solid #e5e7eb}
.chat-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #e5e7eb}
.chat-title{font-size:12px;font-weight:600;color:#374151}
.dark .chat-title{color:#e5e7eb}
.chat-status{display:flex;align-items:center;gap:5px;font-size:11px;color:#22c55e}
.status-dot{width:6px;height:6px;background:#22c55e;border-radius:50%}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px}
.msg-ai .avatar,.msg-user .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:#fff}
.msg-ai .avatar{background:#0ea5e9}
.msg-user .avatar{background:#6366f1}
.bubble{padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.5;max-width:85%}
.msg-ai .bubble{background:#f3f4f6;border:1px solid #e5e7eb}
.msg-user .bubble{background:rgba(14,165,233,.08);border:1px solid rgba(14,165,233,.15);align-self:flex-end;border-radius:10px 10px 4px 10px}
.bubble-name{font-size:10px;font-weight:700;color:#0ea5e9;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.chat-input-wrap{display:flex;gap:6px;padding:10px 12px;border-top:1px solid #e5e7eb}
.chat-input{flex:1;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;font:13px 'DM Sans',sans-serif;outline:none}
.chat-input:focus{border-color:#0ea5e9}
.send-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#0ea5e9;border:none;border-radius:8px;color:#fff;cursor:pointer;flex-shrink:0}
.send-btn:hover{background:#0284c7}
.send-btn svg{width:14px;height:14px;fill:#fff}

/* настройки */
.settings{display:none;height:calc(100vh - 40px);background:#fafafa}
.settings-inner{display:flex;height:100%}
.settings-nav{width:200px;background:#fff;border-right:1px solid #e5e7eb;padding:16px 0}
.settings-nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 20px;background:none;border:none;text-align:left;font:14px 'DM Sans',sans-serif;color:#6b7280;cursor:pointer}
.settings-nav button:hover{background:rgba(0,0,0,.03);color:#374151}
.settings-nav button.active{color:#0ea5e9;background:rgba(14,165,233,.06);font-weight:600}
.settings-nav button svg{width:16px;height:16px;fill:currentColor}
.settings-content{flex:1;padding:32px;overflow-y:auto}
.settings-content h3{font-size:18px;font-weight:700;margin-bottom:20px;color:#111827}
.option-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f3f4f6}
.option-row label{font-size:14px;color:#374151}
.toggle{width:40px;height:22px;background:#d1d5db;border-radius:11px;position:relative;cursor:pointer;transition:background .15s}
.toggle.on{background:#0ea5e9}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s}
.toggle.on::after{transform:translateX(18px)}
.select-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.select-opt{padding:10px 16px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;cursor:pointer;transition:all .15s}
.select-opt:hover{border-color:#9ca3af}
.select-opt.chosen{border-color:#0ea5e9;background:rgba(14,165,233,.05);color:#0ea5e9;font-weight:600}
.slider{width:200px;height:4px;border-radius:2px;outline:none;-webkit-appearance:none;background:#e5e7eb}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#0ea5e9;border-radius:50%;cursor:pointer}
.slider-val{font-size:13px;font-weight:600;color:#0ea5e9;min-width:30px;text-align:right}

/* тосты */
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;animation:fadeIn .2s;z-index:999}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* диалоги */
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
.dialog-box{background:#fff;border-radius:12px;padding:20px;min-width:280px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.dark .dialog-box{background:#1f2937}
.dialog-box h4{font-size:15px;font-weight:600;margin-bottom:12px}
.dialog-box input{width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;font:13px 'DM Sans',sans-serif;outline:none;margin-bottom:14px}
.dark .dialog-box input{background:#0f172a;border-color:#374151;color:#e5e7eb}
.dialog-btns{display:flex;justify-content:flex-end;gap:6px}
.dialog-btns button{padding:7px 14px;border-radius:6px;font:500 13px 'DM Sans',sans-serif;cursor:pointer;border:1px solid #e5e7eb;background:#fff;color:#374151}
.dialog-btns button.primary{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
.dialog-btns button.primary:hover{background:#0284c7}

/* контекстное меню */
.ctx-menu{position:fixed;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:4px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:100;display:none}
.dark .ctx-menu{background:#1f2937;border-color:#374151}
.ctx-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:4px;font-size:13px;cursor:pointer;color:#374151}
.ctx-item:hover{background:rgba(0,0,0,.04)}
.dark .ctx-item{color:#d1d5db}
.dark .ctx-item:hover{background:rgba(255,255,255,.05)}
.ctx-item.danger{color:#ef4444}
.ctx-item svg{width:14px;height:14px;fill:currentColor}
.ctx-sep{height:1px;background:#e5e7eb;margin:4px 8px}
.dark .ctx-sep{background:#374151}
</style>
</head>
<body class="dark">

<!-- TOPBAR -->
<div class="topbar">
<div class="topbar-left">
<span class="app-name">AquaCode</span>
<div class="topbar-menu">
<button data-i18n="m_file">Файл</button>
<button data-i18n="m_edit">Правка</button>
<button data-i18n="m_view">Вид</button>
<button data-i18n="m_run">Запуск</button>
<button data-i18n="m_help">Справка</button>
</div>
</div>
<div class="topbar-right">
<button class="lang-btn" id="langBtn">RU</button>
<span class="ver">v1.0</span>
</div>
</div>

<!-- MAIN -->
<div class="main">

<!-- ACTIVITY -->
<div class="activity">
<div class="activity-top">
<button class="active" data-panel="files" title="Файлы"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></button>
<button data-panel="chat" title="Чат"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></button>
</div>
<div class="activity-bot">
<button data-panel="settings" title="Настройки"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
<div class="sidebar-head">
<span class="sidebar-title" data-i18n="s_explorer">Проводник</span>
<div class="sidebar-btns">
<button id="newFolderBtn" title="Новая папка"><svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/></svg></button>
<button id="newFileBtn" title="Новый файл"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg></button>
</div>
</div>
<input type="text" class="search-box" id="searchInput" placeholder="Поиск файлов...">
<div class="files" id="fileTree"></div>
</div>

<!-- EDITOR -->
<div class="editor" id="editorArea">
<div class="tabs" id="tabs"></div>
<div class="editor-body" id="editorBody" style="display:none">
<div class="line-num" id="lineNums"></div>
<textarea id="codeEditor" spellcheck="false"></textarea>
</div>
<div class="welcome" id="welcomeScreen">
<h1>AquaCode</h1>
<p>Редактор кода с AI-помощником. Откройте файл в проводнике слева, чтобы начать.</p>
<div class="welcome-cards">
<div class="welcome-card" onclick="document.getElementById('newFileBtn').click()"><div class="wc-icon">+</div><div class="wc-title" data-i18n="w_new">Новый файл</div><div class="wc-desc" data-i18n="w_new_desc">Создать пустой</div></div>
<div class="welcome-card" onclick="document.getElementById('newFolderBtn').click()"><div class="wc-icon">/</div><div class="wc-title" data-i18n="w_folder">Новая папка</div><div class="wc-desc" data-i18n="w_folder_desc">Создать папку</div></div>
<div class="welcome-card" onclick="togglePanel('chat')"><div class="wc-icon">~</div><div class="wc-title" data-i18n="w_chat">AI-чат</div><div class="wc-desc" data-i18n="w_chat_desc">Задать вопрос</div></div>
</div>
</div>
</div>

<!-- CHAT -->
<div class="chat" id="chatPanel">
<div class="chat-head">
<span class="chat-title" data-i18n="ch_title">AquaCode AI</span>
<div class="chat-status"><div class="status-dot"></div> <span data-i18n="ch_online">Онлайн</span></div>
</div>
<div class="chat-messages" id="chatMessages"></div>
<div class="chat-input-wrap">
<input type="text" class="chat-input" id="chatInput" placeholder="Спросите что угодно...">
<button class="send-btn" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
</div>
</div>

</div>

<!-- SETTINGS -->
<div class="settings" id="settingsScreen">
<div class="settings-inner">
<div class="settings-nav">
<button class="active" data-section="lang"><svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-13zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg> <span data-i18n="s_lang">Язык</span></button>
<button data-section="theme"><svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-1 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8z"/></svg> <span data-i18n="s_theme">Тема</span></button>
<button data-section="ai"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg> <span data-i18n="s_ai">AI</span></button>
<button data-section="editor"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> <span data-i18n="s_editor">Редактор</span></button>
<button data-section="about"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg> <span data-i18n="s_about">О приложении</span></button>
</div>
<div class="settings-content" id="settingsContent"></div>
</div>
</div>

<!-- DIALOG -->
<div class="dialog-overlay" id="dialogOverlay">
<div class="dialog-box">
<h4 id="dialogTitle"></h4>
<input type="text" id="dialogInput" placeholder="">
<div class="dialog-btns">
<button onclick="closeDialog()" data-i18n="d_cancel">Отмена</button>
<button class="primary" id="dialogConfirm" data-i18n="d_create">Создать</button>
</div>
</div>
</div>

<!-- CTX MENU -->
<div class="ctx-menu" id="ctxMenu">
<div class="ctx-item" data-action="newFolder"><svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/></svg> <span data-i18n="c_newFolder">Новая папка</span></div>
<div class="ctx-item" data-action="newFile"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg> <span data-i18n="c_newFile">Новый файл</span></div>
<div class="ctx-sep"></div>
<div class="ctx-item" data-action="rename"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg> <span data-i18n="c_rename">Переименовать</span></div>
<div class="ctx-item" data-action="copyPath"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z"/></svg> <span data-i18n="c_copyPath">Копировать путь</span></div>
<div class="ctx-sep"></div>
<div class="ctx-item danger" data-action="delete"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> <span data-i18n="c_delete">Удалить</span></div>
</div>

<script>
// ═══════════════════════════════════════════════
// i18n
// ═══════════════════════════════════════════════
const LANG={
  ru:{m_file:'Файл',m_edit:'Правка',m_view:'Вид',m_run:'Запуск',m_help:'Справка',s_explorer:'Проводник',s_search:'Поиск файлов...',s_settings:'Настройки',s_lang:'Язык',s_theme:'Тема',s_ai:'AI',s_editor:'Редактор',s_about:'О приложении',ch_title:'AquaCode AI',ch_online:'Онлайн',ch_placeholder:'Спросите что угодно...',ch_think:'Думаю...',ch_hello:'Привет! Чем могу помочь?',w_new:'Новый файл',w_new_desc:'Создать пустой',w_folder:'Новая папка',w_folder_desc:'Создать папку',w_chat:'AI-чат',w_chat_desc:'Задать вопрос',c_newFolder:'Новая папка',c_newFile:'Новый файл',c_rename:'Переименовать',c_copyPath:'Копировать путь',c_delete:'Удалить',d_cancel:'Отмена',d_create:'Создать',d_rename:'Переименовать',d_folder_name:'имя_папки',d_file_name:'file.js',d_new_name:'Новое имя',t_saved:'Сохранено ✓',s_dark:'Тёмная',s_light:'Светлая',s_mono:'Космос'},
  en:{m_file:'File',m_edit:'Edit',m_view:'View',m_run:'Run',m_help:'Help',s_explorer:'Explorer',s_search:'Search files...',s_settings:'Settings',s_lang:'Language',s_theme:'Theme',s_ai:'AI',s_editor:'Editor',s_about:'About',ch_title:'AquaCode AI',ch_online:'Online',ch_placeholder:'Ask anything...',ch_think:'Thinking...',ch_hello:'Hello! How can I help you?',w_new:'New file',w_new_desc:'Create empty',w_folder:'New folder',w_folder_desc:'Create folder',w_chat:'AI Chat',w_chat_desc:'Ask a question',c_newFolder:'New folder',c_newFile:'New file',c_rename:'Rename',c_copyPath:'Copy path',c_delete:'Delete',d_cancel:'Cancel',d_create:'Create',d_rename:'Rename',d_folder_name:'folder_name',d_file_name:'file.js',d_new_name:'New name',t_saved:'Saved ✓',s_dark:'Dark',s_light:'Light',s_mono:'Space'}
};
let locale='ru';
const t=k=>LANG[locale]?.[k]||LANG.ru[k]||k;
const updLang=()=>{document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n))};

// ═══════════════════════════════════════════════
// файлы
// ═══════════════════════════════════════════════
let files=[
  {n:'src',d:true,p:'/src',c:[
    {n:'app.js',d:false,p:'/src/app.js',v:'// Точка входа\nconsole.log("Привет из AquaCode!");'},
    {n:'index.html',d:false,p:'/src/index.html',v:'<!DOCTYPE html>\n<html>\n<head><title>App</title></head>\n<body>\n  <h1>Hello</h1>\n</body>\n</html>'},
    {n:'style.css',d:false,p:'/src/style.css',v:'body {\n  margin: 0;\n  padding: 20px;\n  font-family: sans-serif;\n}'},
    {n:'utils',d:true,p:'/src/utils',c:[
      {n:'helpers.js',d:false,p:'/src/utils/helpers.js',v:'export const sum = (a, b) => a + b;'},
      {n:'api.js',d:false,p:'/src/utils/api.js',v:'export async function getData(url) {\n  const res = await fetch(url);\n  return res.json();\n}'}
    ]}
  ]},
  {n:'package.json',d:false,p:'/package.json',v:'{\n  "name": "my-project",\n  "version": "1.0.0"\n}'},
  {n:'README.md',d:false,p:'/README.md',v:'# My Project\n\nBuilt with AquaCode.'}
];
let openFiles=[],activeFile=null,cache=new Map(),selected=null,expanded=new Set(['/src']),ctxNode=null;
const ext=n=>{if(n.d)return'folder';return n.n.split('.').pop()||'default'};

function renderTree(nodes,depth=0,q=''){
  if(!nodes)return'';
  const sq=q.toLowerCase();
  return[...nodes].sort((a,b)=>{if(a.d&&!b.d)return-1;if(!a.d&&b.d)return 1;return a.n.localeCompare(b.n)}).filter(n=>{if(!sq)return true;if(n.n.toLowerCase().includes(sq))return true;if(n.d)return n.c?.some(c=>renderTree([c],0,sq)!=='');return false}).map(n=>{
    const open=expanded.has(n.p),sel=selected?.p===n.p;
    let h=`<div class="file-item${sel?' selected':''}" data-p="${n.p}" data-d="${n.d}" style="padding-left:${8+depth*14}px">`;
    if(n.d)h+=`<span class="arrow${open?' open':''}">▶</span>`;
    else h+=`<span style="width:16px"></span>`;
    h+=`<span class="icon ${ext(n)}">${n.d?'📁':n.n.split('.').pop().toUpperCase()}</span>`;
    h+=`<span>${n.n}</span></div>`;
    if(n.d&&open&&n.c)h+=`<div class="file-children">${renderTree(n.c,depth+1,sq)}</div>`;
    return h;
  }).join('');
}
function renderFiles(){document.getElementById('fileTree').innerHTML=renderTree(files,0,document.getElementById('searchInput').value)}
function findNode(p,nodes){for(const n of nodes){if(n.p===p)return n;if(n.c){const f=findNode(p,n.c);if(f)return f}}return null}
function parentPath(p){const parts=p.split('/').filter(Boolean);parts.pop();return parts.length?'/'+parts.join('/'):''}

// ═══════════════════════════════════════════════
// редактор
// ═══════════════════════════════════════════════
function renderTabs(){document.getElementById('tabs').innerHTML=openFiles.map((f,i)=>`<button class="tab${f.p===activeFile?.p?' active':''}" data-i="${i}">${f.n}<span class="tab-close" data-c="${i}">×</span></button>`).join('')}
function renderLines(){const ed=document.getElementById('codeEditor'),ln=document.getElementById('lineNums');if(!ed||!ln)return;ln.innerHTML=Array.from({length:ed.value.split('\n').length},(_,i)=>`<div>${i+1}</div>`).join('')}
function openFile(n){if(n.d)return;let c=cache.get(n.p);if(c===undefined){c=n.v||'// '+n.n;cache.set(n.p,c)}if(!openFiles.find(f=>f.p===n.p))openFiles.push(n);activeFile=n;document.getElementById('editorBody').style.display='flex';document.getElementById('welcomeScreen').style.display='none';document.getElementById('codeEditor').value=c;renderTabs();renderLines()}
function closeTab(i){const f=openFiles[i];openFiles.splice(i,1);if(activeFile?.p===f?.p){activeFile=openFiles[Math.min(i,openFiles.length-1)]||null;if(activeFile){document.getElementById('codeEditor').value=cache.get(activeFile.p)||'';renderLines()}}if(!openFiles.length){activeFile=null;document.getElementById('editorBody').style.display='none';document.getElementById('welcomeScreen').style.display='flex'}renderTabs()}

// ═══════════════════════════════════════════════
// чат
// ═══════════════════════════════════════════════
let msgs=[{text:t('ch_hello'),ai:true}];
function genReply(inp){const l=inp.toLowerCase();if(l.includes('привет')||l.includes('hello')||l.includes('hi'))return t('ch_hello');return locale==='ru'?`Понял: "${inp}". Уточните задачу.`:`Got it: "${inp}". What specifically?`}
function renderChat(){document.getElementById('chatMessages').innerHTML=msgs.map(m=>`<div class="msg ${m.ai?'msg-ai':'msg-user'}"><div class="avatar">${m.ai?'AI':'Вы'}</div><div class="bubble">${m.ai?'<div class="bubble-name">AquaCode</div>':''}${m.text.replace(/</g,'&lt;')}</div></div>`).join('');document.getElementById('chatMessages').scrollTop=9999}
function sendMsg(){const inp=document.getElementById('chatInput');if(!inp.value.trim())return;const txt=inp.value.trim();inp.value='';msgs.push({text:txt,ai:false});renderChat();setTimeout(()=>{msgs.push({text:genReply(txt),ai:true});renderChat()},800)}

// ═══════════════════════════════════════════════
// настройки
// ═══════════════════════════════════════════════
let curSection='lang';
function renderSettings(){
  document.querySelectorAll('.settings-nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===curSection));
  const c=document.getElementById('settingsContent');
  if(curSection==='lang'){
    c.innerHTML=`<h3>${t('s_lang')}</h3><div class="select-group"><div class="select-opt${locale==='ru'?' chosen':''}" data-v="ru">Русский</div><div class="select-opt${locale==='en'?' chosen':''}" data-v="en">English</div></div>`;
    c.querySelectorAll('.select-opt').forEach(o=>o.onclick=()=>{locale=o.dataset.v;localStorage.setItem('lang',locale);document.getElementById('langBtn').textContent=locale.toUpperCase();updLang();renderSettings()});
  }else if(curSection==='theme'){
    const dark=!document.body.classList.contains('dark');
    c.innerHTML=`<h3>${t('s_theme')}</h3><div class="option-row"><label>${t('s_dark')}</label><div class="toggle${dark?'':' on'}" id="themeToggle"></div></div>`;
    document.getElementById('themeToggle').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');renderSettings()};
  }else if(curSection==='ai'){
    c.innerHTML=`<h3>AI</h3><div class="option-row"><label>${t('s_ai')} — модель</label><span style="color:#0ea5e9;font-weight:600">AquaCode v1</span></div><div class="option-row"><label data-i18n="s_editor">Редактор</label><div class="select-group"><div class="select-opt chosen">Fira Code</div><div class="select-opt">Inter</div><div class="select-opt">JetBrains</div></div></div>`;
  }else if(curSection==='editor'){
    c.innerHTML=`<h3>${t('s_editor')}</h3><div class="option-row"><label>Размер шрифта</label><div style="display:flex;align-items:center;gap:12px"><input type="range" class="slider" min="10" max="24" value="14" id="fontSlider"><span class="slider-val" id="fontVal">14</span></div></div><div class="option-row"><label>Табуляция</label><div class="select-group"><div class="select-opt chosen">2</div><div class="select-opt">4</div><div class="select-opt">8</div></div></div>`;
    document.getElementById('fontSlider').oninput=e=>{document.getElementById('fontVal').textContent=e.target.value;document.getElementById('codeEditor').style.fontSize=e.target.value+'px'};
  }else if(curSection==='about'){
    c.innerHTML=`<h3>${t('s_about')}</h3><p style="color:#6b7280;line-height:1.8">AquaCode — минималистичный редактор кода.<br>Версия 1.0.0<br>HTML + CSS + JavaScript</p>`;
  }
}

// ═══════════════════════════════════════════════
// диалог
// ═══════════════════════════════════════════════
let dialogCb=null;
function showDialog(title,ph,cb){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogInput').placeholder=ph;document.getElementById('dialogInput').value='';document.getElementById('dialogOverlay').style.display='flex';document.getElementById('dialogInput').focus();dialogCb=cb}
function closeDialog(){document.getElementById('dialogOverlay').style.display='none';dialogCb=null}
document.getElementById('dialogConfirm').onclick=()=>{const v=document.getElementById('dialogInput').value.trim();if(v&&dialogCb){dialogCb(v);closeDialog()}};
document.getElementById('dialogInput').onkeydown=e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v&&dialogCb){dialogCb(v);closeDialog()}}};

// ═══════════════════════════════════════════════
// панели
// ═══════════════════════════════════════════════
let panels={files:true,chat:true,settings:false};
function togglePanel(p){
  if(p==='settings'){panels.settings=!panels.settings;document.getElementById('settingsScreen').style.display=panels.settings?'flex':'none';document.getElementById('editorArea').parentElement.style.display=panels.settings?'none':'flex';if(panels.settings)renderSettings();return}
  panels[p]=!panels[p];
  if(p==='files')document.getElementById('sidebar').style.display=panels.files?'flex':'none';
  if(p==='chat')document.getElementById('chatPanel').style.display=panels.chat?'flex':'none';
  document.querySelectorAll('.activity button').forEach(b=>{
    const pp=b.dataset.panel;
    b.classList.toggle('active',panels[pp]);
  });
}

// ═══════════════════════════════════════════════
// инициализация
// ═══════════════════════════════════════════════
function init(){
  const sl=localStorage.getItem('lang');if(sl)locale=sl;
  const th=localStorage.getItem('theme');if(th==='light')document.body.classList.remove('dark');
  document.getElementById('langBtn').textContent=locale.toUpperCase();
  updLang();renderFiles();renderChat();

  // activity buttons
  document.querySelectorAll('.activity button').forEach(b=>b.onclick=()=>togglePanel(b.dataset.panel));

  // file tree
  document.getElementById('fileTree').onclick=e=>{
    const el=e.target.closest('.file-item');if(!el)return;
    const node=findNode(el.dataset.p);if(!node)return;
    if(node.d){if(expanded.has(node.p))expanded.delete(node.p);else expanded.add(node.p)}else{selected=node;openFile(node)}
    renderFiles();
  };
  document.getElementById('fileTree').oncontextmenu=e=>{
    const el=e.target.closest('.file-item');if(!el)return;e.preventDefault();
    const node=findNode(el.dataset.p);if(!node)return;ctxNode=node;
    const m=document.getElementById('ctxMenu');m.style.display='block';m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';
    m.querySelector('[data-action="newFolder"]').style.display=node.d?'flex':'none';
    m.querySelector('[data-action="newFile"]').style.display=node.d?'flex':'none';
  };
  document.addEventListener('click',()=>document.getElementById('ctxMenu').style.display='none');
  document.querySelectorAll('.ctx-item').forEach(i=>i.onclick=()=>{
    const a=i.dataset.action;if(!ctxNode)return;
    const pp=ctxNode.d?ctxNode.p:parentPath(ctxNode.p);
    if(a==='newFolder')showDialog(t('c_newFolder'),t('d_folder_name'),name=>{const fp=pp+'/'+name;const np={n:name,d:true,p:fp,c:[]};const par=findNode(pp);if(par){if(!par.c)par.c=[];par.c.push(np)}else files.push(np);expanded.add(pp);renderFiles()});
    else if(a==='newFile')showDialog(t('c_newFile'),t('d_file_name'),name=>{const fp=pp+'/'+name;const nf={n:name,d:false,p:fp,v:''};const par=findNode(pp);if(par){if(!par.c)par.c=[];par.c.push(nf)}else files.push(nf);renderFiles()});
    else if(a==='rename')showDialog(t('c_rename'),t('d_new_name'),name=>{ctxNode.n=name;ctxNode.p=pp+'/'+name;renderFiles()});
    else if(a==='copyPath')navigator.clipboard.writeText(ctxNode.p);
    else if(a==='delete'){if(confirm(t('c_delete')+' "'+ctxNode.n+'"?')){const par=findNode(parentPath(ctxNode.p));if(par&&par.c)par.c=par.c.filter(c=>c!==ctxNode);else files=files.filter(c=>c!==ctxNode);ctxNode=null;renderFiles()}}
    document.getElementById('ctxMenu').style.display='none';
  });

  // new file/folder
  const mkDir=isd=>showDialog(isd?t('c_newFolder'):t('c_newFile'),isd?t('d_folder_name'):t('d_file_name'),name=>{const fp='/'+name;if(isd)files.push({n:name,d:true,p:fp,c:[]});else files.push({n:name,d:false,p:fp,v:''});renderFiles()});
  document.getElementById('newFolderBtn').onclick=()=>mkDir(true);
  document.getElementById('newFileBtn').onclick=()=>mkDir(false);

  // tabs
  document.getElementById('tabs').onclick=e=>{
    const cl=e.target.closest('.tab-close');if(cl){closeTab(parseInt(cl.dataset.c));return}
    const tab=e.target.closest('.tab');if(tab){const i=parseInt(tab.dataset.i);activeFile=openFiles[i];document.getElementById('codeEditor').value=cache.get(activeFile.p)||'';renderTabs();renderLines()}
  };

  // editor
  const ed=document.getElementById('codeEditor');
  ed.oninput=()=>{if(activeFile){cache.set(activeFile.p,ed.value);renderLines()}};
  ed.onscroll=()=>{document.getElementById('lineNums').scrollTop=ed.scrollTop};
  ed.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();const s=ed.selectionStart,en=ed.selectionEnd;ed.value=ed.value.substring(0,s)+'  '+ed.value.substring(en);ed.selectionStart=ed.selectionEnd=s+2;if(activeFile)cache.set(activeFile.p,ed.value);renderLines()}};

  // chat
  document.getElementById('sendBtn').onclick=sendMsg;
  document.getElementById('chatInput').onkeydown=e=>{if(e.key==='Enter')sendMsg()};

  // search
  document.getElementById('searchInput').oninput=()=>renderFiles();

  // settings nav
  document.querySelectorAll('.settings-nav button').forEach(b=>b.onclick=()=>{curSection=b.dataset.section;renderSettings()});

  // lang toggle
  document.getElementById('langBtn').onclick=()=>{locale=locale==='ru'?'en':'ru';localStorage.setItem('lang',locale);document.getElementById('langBtn').textContent=locale.toUpperCase();updLang();if(panels.settings)renderSettings()};
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
